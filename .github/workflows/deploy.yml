name: CI/CD for Microservice

on:
  push:
    branches:
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t hello-service ./hello-service

    - name: Run Container
      run: |
        docker run -d --name hello-container -p 5000:5000 hello-service
        sleep 5

    - name: Test Microservice
      run: curl http://localhost:5000

    - name: Cleanup
      run: |
        docker stop hello-container
        docker rm hello-container

    - name: Deploy Step
      run: echo "Deploying microservice... (placeholder)"

